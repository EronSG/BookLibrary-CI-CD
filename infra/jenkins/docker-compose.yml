services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    image: booklibrary-jenkins:2.516.3-lts-jdk17
    container_name: booklibrary-jenkins
    restart: unless-stopped
    ports:
      - "8084:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=true"
volumes:
  jenkins_home:
